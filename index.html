<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024">
    <title>Course Certificate</title>
    <style>
        body {
            display: block;
            margin: 8px;
        }

        element.style {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        center {
            display: block;
            text-align: -webkit-center;
            unicode-bidi: isolate;
        }

        button {
            color: white;
            background-color: #3070bf;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            width: 156px;
        }
    </style>
</head>

<body>
    <center style="position: absolute;top: 40%;left: 50%;transform: translate(-50%, -50%);">
        <button id="downloadBtn" onclick="downloadCertificate()">Course Certificate</button>
    </center>

    <script>
        function downloadCertificate() {
            const link = document.createElement('a');
            link.href = 'NPTEL24CS131S550300681.pdf';
            link.download = 'NPTEL24CS131S550300681.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>

</html>
